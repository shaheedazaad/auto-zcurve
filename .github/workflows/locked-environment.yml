name: Locked environment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser-tests:
    name: Browser behavior and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  install-and-smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-26
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser integration test dependencies
        run: npm ci
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          frozen: true
          cache: true
      - name: Verify locked install
        run: pixi install --locked
      - name: Run Python and R tests
        run: pixi run --locked test
      - name: Render fixture with R and Quarto
        run: pixi run --locked release-smoke
      - name: Build release bundles
        run: pixi run python scripts/build_release.py
