name: Locked environment

on:
  # Branches with a PR are tested by the pull_request event; running push too
  # would test every PR commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same PR replaces its unfinished run; main always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser-tests:
    name: Browser behavior and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  install-and-smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-26
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install browser integration test dependencies
        run: pnpm install --frozen-lockfile
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          frozen: true
          cache: true
          # PRs reuse main's cache without spending a minute saving their own.
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Verify locked install
        run: pixi install --locked
      - name: Run Python and R tests with Python coverage (fails below 100%)
        run: pixi run --locked test-coverage
      - name: Render fixture with R and Quarto
        run: pixi run --locked release-smoke
      - name: Build release bundles
        run: pixi run python scripts/build_release.py
